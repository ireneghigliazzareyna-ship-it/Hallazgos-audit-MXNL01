<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Hallazgos de Auditorías - MXNL01</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --main-header: #c2185b; /* Un tono diferente para distinguir el proyecto */
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        #status {
            text-align: center;
            padding: 15px;
            background: #fce4ec;
            color: #c2185b;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .panel-header {
            padding: 12px 20px;
            border-radius: 8px;
            background-color: var(--main-header);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #64748b;
        }

        input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
        }

        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .kpi-title { font-size: 0.85rem; color: #64748b; text-transform: uppercase; font-weight: bold; }
        .kpi-value { font-size: 1.8rem; font-weight: bold; margin-top: 10px; color: var(--main-header); }

        .chart-box {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            height: 350px;
            margin-bottom: 20px;
        }

        .table-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: #f8fafc;
            position: sticky;
            top: 0;
            color: #475569;
        }

        .monto-alerta { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Dashboard Hallazgos de Auditorías - MXNL01</h1>
    
    <div id="status">Cargando datos de discrepancias...</div>

    <div class="panel" id="main-panel" style="display:none;">
        <div class="panel-header">Discrepancias Inbound P2M</div>
        
        <div class="filters-grid">
            <div class="filter-group">
                <label>Buscar (SKU, Inbound o Seller):</label>
                <input type="text" id="search" placeholder="Escribe para buscar..." oninput="filtrarDatos()">
            </div>
        </div>

        <div class="kpi-container">
            <div class="kpi-card">
                <div class="kpi-title">Inbounds Afectados</div>
                <div class="kpi-value" id="kpi-inbounds">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Total Piezas Diferencia</div>
                <div class="kpi-value" id="kpi-piezas">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Impacto Total (USD)</div>
                <div class="kpi-value" id="kpi-usd">$0.00</div>
            </div>
        </div>

        <div class="chart-box">
            <div style="text-align: center; font-weight: bold; color: #64748b; margin-bottom: 10px; font-size: 0.85rem;">IMPACTO USD POR SELLER (TOP 10)</div>
            <div style="position: relative; height: 300px; width: 100%;">
                <canvas id="chartSellers"></canvas>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Inbound ID</th>
                        <th>Seller</th>
                        <th>SKU</th>
                        <th>Declarada</th>
                        <th>Recibida</th>
                        <th>Diferencia</th>
                        <th>Diferencia USD</th>
                    </tr>
                </thead>
                <tbody id="contenido"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let datosOriginales = [];
    let chartInstancia = null;

    function formatearDinero(num) { 
        return '$' + parseFloat(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); 
    }

    // El archivo será data.json proveniente del nodo n8n
    fetch('data.json?timestamp=' + new Date().getTime())
        .then(res => res.json())
        .then(data => {
            datosOriginales = data;
            document.getElementById('status').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            filtrarDatos();
        })
        .catch(err => {
            document.getElementById('status').innerText = 'Error al cargar data.json: ' + err.message;
        });

    function filtrarDatos() {
        const textoBusqueda = document.getElementById('search').value.toLowerCase();
        
        const resultados = datosOriginales.filter(item => {
            const sku = String(item.sku || '').toLowerCase();
            const inboundId = String(item.inboundId || '').toLowerCase();
            const seller = String(item.nombreSeller || '').toLowerCase();
            
            return !textoBusqueda || sku.includes(textoBusqueda) || inboundId.includes(textoBusqueda) || seller.includes(textoBusqueda);
        });

        actualizarKPIs(resultados);
        actualizarTabla(resultados);
        actualizarGrafica(resultados);
    }

    function actualizarKPIs(datos) {
        const inboundsUnicos = new Set(datos.map(d => d.inboundId)).size;
        const totalPiezas = datos.reduce((sum, d) => sum + (parseInt(d.diferencia) || 0), 0);
        const totalUSD = datos.reduce((sum, d) => sum + (parseFloat(d.diferenciaUsd) || 0), 0);

        document.getElementById('kpi-inbounds').innerText = inboundsUnicos.toLocaleString();
        document.getElementById('kpi-piezas').innerText = totalPiezas.toLocaleString();
        document.getElementById('kpi-usd').innerText = formatearDinero(totalUSD);
    }

    function actualizarTabla(datos) {
        const tbody = document.getElementById('contenido');
        if (datos.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Sin resultados</td></tr>';
            return;
        }

        tbody.innerHTML = datos.map(item => `
            <tr>
                <td><strong>${item.inboundId}</strong></td>
                <td>${item.nombreSeller}</td>
                <td><code>${item.sku}</code></td>
                <td>${item.cantDeclarada}</td>
                <td>${item.cantRecibida}</td>
                <td style="font-weight:bold;">${item.diferencia}</td>
                <td class="monto-alerta">${formatearDinero(item.diferenciaUsd)}</td>
            </tr>
        `).join('');
    }

    function actualizarGrafica(datos) {
        const impactoPorSeller = {};
        
        // Agrupar impacto USD por Seller
        datos.forEach(d => {
            const seller = d.nombreSeller || 'Desconocido';
            const usd = parseFloat(d.diferenciaUsd) || 0;
            impactoPorSeller[seller] = (impactoPorSeller[seller] || 0) + usd;
        });

        // Ordenar de mayor a menor y tomar los primeros 10
        const topSellers = Object.keys(impactoPorSeller)
            .sort((a, b) => impactoPorSeller[b] - impactoPorSeller[a])
            .slice(0, 10);

        const dataSellers = topSellers.map(seller => impactoPorSeller[seller]);

        if (chartInstancia) chartInstancia.destroy();

        const ctx = document.getElementById('chartSellers').getContext('2d');
        chartInstancia = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: topSellers,
                datasets: [{
                    label: 'Impacto (USD)',
                    data: dataSellers,
                    backgroundColor: '#c2185b',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } }
            }
        });
    }
</script>
</body>
</html>
